name: Publish to Maven Central

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    # Gates the only job that can read the release signing key and the Sonatype
    # token. Protection rules (required reviewers, `v*` tag restriction) are
    # configured on the environment itself, not here.
    environment: maven-central

    # id-token is what Sigstore keyless signing binds the artifact to: it proves
    # the release came from this repo and this workflow, which is the closest
    # thing available to trusted publishing on Maven Central.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Preconfigure gradle
        uses: ./.github/actions/prepare-gradle

      - name: Publish to Maven Central
        run: ./gradlew FlagsmithClient:publishAndReleaseToMavenCentral -Psigstore
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ vars.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
