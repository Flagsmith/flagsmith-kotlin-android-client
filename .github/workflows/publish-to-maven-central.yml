name: Publish to Maven Central

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    # Gates the only job that can read the release signing key and the Sonatype
    # token. Protection rules (required reviewers, `v*` tag restriction) are
    # configured on the environment itself, not here.
    environment: maven-central

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Preconfigure gradle
        uses: ./.github/actions/prepare-gradle

      - name: Publish to Maven Central
        run: ./gradlew FlagsmithClient:publishAndReleaseToMavenCentral
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ vars.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
