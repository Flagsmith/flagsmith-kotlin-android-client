name: Verify pull request to main

on:
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Preconfigure gradle
        uses: ./.github/actions/prepare-gradle

      - name: Run unit tests
        run: ./gradlew check -x koverVerify -P excludeIntegrationTests

  build:
    name: Test build process
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Preconfigure gradle
        uses: ./.github/actions/prepare-gradle

      # The release signing key is deliberately not available here. This job only
      # needs to prove the publication assembles and signs, so it generates a
      # throwaway key for the run rather than decrypting the real one into CI.
      - name: Test Build Process
        run: |
          export GNUPGHOME="$(mktemp -d)"
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword="$(openssl rand -hex 16)"
          gpg --batch --pinentry-mode loopback \
            --passphrase "$ORG_GRADLE_PROJECT_signingInMemoryKeyPassword" \
            --quick-gen-key 'Flagsmith CI (throwaway) <ci@flagsmith.invalid>' default default never
          ORG_GRADLE_PROJECT_signingInMemoryKey="$(gpg --batch --pinentry-mode loopback \
            --passphrase "$ORG_GRADLE_PROJECT_signingInMemoryKeyPassword" \
            --armor --export-secret-keys)"
          export ORG_GRADLE_PROJECT_signingInMemoryKey ORG_GRADLE_PROJECT_signingInMemoryKeyPassword
          ./gradlew publishToMavenLocal
